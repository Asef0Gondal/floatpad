name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--bundles app,dmg'
          - os: ubuntu-latest
            args: '--bundles deb,appimage'
          - os: windows-latest
            args: '--bundles nsis'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # Gate the release on the test suites
      - run: npm run build
      - run: npm test
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FloatPad ${{ github.ref_name }}'
          releaseBody: 'Native Rust/Tauri build. Unsigned binaries: on macOS right-click → Open the first time; on Windows SmartScreen → More info → Run anyway.'
          args: ${{ matrix.args }}