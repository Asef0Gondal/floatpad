[package]
name = "floatpad"
version = "2.9.0"
description = "FloatPad — lean always-on-top reference pad"
authors = ["Asif Gondal"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "floatpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
base64 = "0.23.1"
env_logger = "0.11.12"
image = { version = "0.25.10", default-features = false, features = ["gif", "png"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["unstable", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-drag = "2.1.1"
tauri-plugin-fs = "2.7.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tokio = { version = "1.54.1", features = ["time"] }
xcap = "0.9.10"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-image-io = { version = "0.3.2", features = ["CGImageSource"] }
objc2-vision = "0.3.2"
objc2-web-kit = { version = "0.3.2", features = ["WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebViewConfiguration", "WKWebView", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
